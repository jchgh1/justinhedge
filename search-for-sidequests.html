<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="The Search for Sidequests, the first series within The John Spear Show.">
  <title>The Search for Sidequests — The John Spear Show</title>
  <style>

    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root { color-scheme: dark; --page-bg: #0a1116; --accent: #c3d3dc; --muted: #82909a; --rule: #29343b; }
    html { scroll-behavior: smooth; }
    body { min-height: 100vh; background: var(--page-bg); color: #fff; font-family: Arial, Helvetica, sans-serif; }
    .site-header { position: absolute; top: 32px; left: 40px; right: 40px; z-index: 3; height: 70px; }
    .site-brand { position: absolute; top: 0; left: 0; width: max-content; color: #fff; line-height: .85; text-decoration: none; }
    .site-brand-text { display: block; font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif; font-size: 2rem; font-weight: 900; }
    .site-brand-films { display: block; width: 100%; margin-top: 8px; font-family: Georgia, 'Times New Roman', serif; font-size: .8rem; font-style: italic; letter-spacing: .35em; text-align: center; }
    .site-menu { position: absolute; top: 0; right: 0; display: flex; align-items: center; gap: 26px; }
    .site-menu-button, .site-about { padding: 0; border: 0; background: transparent; color: #fff; font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif; font-size: .65rem; font-weight: 700; letter-spacing: .12em; text-decoration: none; white-space: nowrap; cursor: pointer; transition: color .3s ease, text-shadow .3s ease; }
    .site-menu-button:hover, .site-menu-button:focus-visible, .site-about:hover { color: var(--accent); text-shadow: 0 0 12px #31516a; }
    .site-menu-button:focus-visible, .site-brand:focus-visible, .site-menu-links a:focus-visible, .site-about:focus-visible, a:focus-visible { outline: 1px solid var(--accent); outline-offset: 5px; }
    .site-menu-links { display: none; position: absolute; top: 36px; right: 65px; width: max-content; text-align: right; }
    .site-menu-links a { display: block; margin-bottom: 14px; color: #fff; font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif; font-size: .7rem; font-weight: 700; letter-spacing: .12em; text-decoration: none; transition: color .3s ease, text-shadow .3s ease; }
    .site-menu-links a:hover { color: var(--accent); text-shadow: 0 0 12px #31516a; }
    .site-menu.is-open .site-menu-links { display: block; }
    footer { padding: 28px 24px 34px; color: var(--muted); font-family: Georgia, 'Times New Roman', serif; font-size: .75rem; letter-spacing: .08em; text-align: center; }
    @media (max-width: 600px) { .site-header { top: 20px; left: 20px; right: 20px; height: 60px; } .site-brand-text { font-size: 1.5rem; } .site-brand-films { margin-top: 7px; font-size: .7rem; } .site-menu { gap: 12px; } .site-menu-button, .site-about { font-size: .5rem; letter-spacing: .06em; } .site-menu-links { top: 30px; right: 52px; } }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }

    .series-hero { position: relative; min-height: 115svh; padding: 120px 30px 70px; text-align: center; }
    .series-hero-image { position: absolute; z-index: 0; inset: 0; overflow: hidden; background: #111214 url('search for sidequests.jpg?v=20260926') center 54% / cover no-repeat; -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 70%, transparent 100%); mask-image: linear-gradient(to bottom, #000 0%, #000 70%, transparent 100%); }
    .series-hero-image::before { position: absolute; inset: -24px 0; background: inherit; content: ''; filter: blur(22px); opacity: .55; -webkit-mask-image: linear-gradient(to bottom, transparent 70%, #000 82%, transparent 100%); mask-image: linear-gradient(to bottom, transparent 70%, #000 82%, transparent 100%); }
    .series-hero-image::after { position: absolute; inset: 0; background: rgba(7, 11, 15, .3); content: ''; }
    .series-hero-inner { position: absolute; z-index: 1; top: 50svh; right: 30px; left: 30px; transform: translateY(-50%); }
    .franchise-title { display: inline-block; color: #fff; font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif; font-size: .72rem; font-weight: 700; letter-spacing: .2em; text-decoration: none; text-shadow: 0 0 12px rgba(255, 255, 255, .1); transition: color .25s ease; }
    .franchise-title:hover { color: #bbb; }
    .series-title { max-width: 1100px; margin: 24px auto 0; font-family: Georgia, 'Times New Roman', serif; font-size: clamp(2.6rem, 7vw, 6rem); font-style: italic; font-weight: 400; line-height: 1.04; text-shadow: 0 0 18px rgba(255, 255, 255, .14); }
    .hero-year { display: block; margin-top: 34px; color: #aaa; font-size: .7rem; letter-spacing: .18em; }
    .scroll-indicator { position: absolute; z-index: 2; bottom: calc(30svh + 29px); left: 50%; color: #fff; font-size: 1.45rem; line-height: 1; opacity: .28; text-decoration: none; transform: translateX(-50%); animation: arrowPulse 2.7s ease-in-out infinite; transition: filter .35s ease; }
    .scroll-indicator.is-hidden { filter: opacity(0); pointer-events: none; }
    .scroll-indicator:hover, .scroll-indicator:focus-visible { opacity: .62; }
    @keyframes arrowPulse { 0%, 100% { opacity: .22; } 50% { opacity: .48; } }
    .series-content { position: relative; z-index: 1; width: min(1100px, calc(100% - 80px)); margin: 0 auto; padding: 12px 0 125px; }
    .episode-archive { padding-top: 12px; }
    .archive-heading { margin-bottom: 18px; font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif; font-size: .8rem; font-weight: 700; letter-spacing: .15em; }
    .episode-list { list-style: none; border-bottom: 1px solid var(--rule); }
    .episode-row { display: grid; grid-template-columns: 72px 1fr 80px 22px; align-items: baseline; gap: 14px; min-height: 70px; padding: 21px 0 18px; border-top: 1px solid var(--rule); color: #fff; text-decoration: none; transition: padding-left .25s ease, color .25s ease; }
    .episode-row:hover { padding-left: 10px; color: #ddd; }
    .episode-number { color: var(--muted); font-family: Georgia, 'Times New Roman', serif; font-size: .9rem; }
    .episode-title { font-size: 1rem; letter-spacing: .015em; }
    .episode-year { color: var(--muted); font-size: .8rem; text-align: right; }
    .episode-arrow { color: var(--muted); text-align: right; }
    @media (max-width: 600px) { .series-hero { min-height: 115svh; padding: 105px 20px 55px; } .series-hero-inner { top: 50svh; right: 20px; left: 20px; } .series-title { margin-top: 19px; font-size: clamp(2.35rem, 10vw, 3.8rem); } .hero-year { margin-top: 28px; } .series-content { width: calc(100% - 40px); padding: 12px 0 85px; } .episode-archive { padding-top: 8px; } .archive-heading { margin-bottom: 14px; } .episode-row { grid-template-columns: 38px 1fr 48px; gap: 9px; min-height: 62px; } .episode-title { font-size: .9rem; } .episode-arrow { display: none; } .episode-year { font-size: .72rem; } }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="site-brand" href="index.html" aria-label="JazzClub Films home"><span class="site-brand-text">JAZZCLUB</span><span class="site-brand-films">films</span></a>
    <div class="site-menu">
      <button class="site-menu-button" type="button" aria-label="Open other productions" aria-expanded="false" aria-controls="site-menu-links">OTHER PRODUCTIONS</button>
      <a class="site-about" href="about.html">ABOUT</a>
      <nav class="site-menu-links" id="site-menu-links" aria-label="Other productions">
        <a href="john-spear-show.html">THE JOHN SPEAR SHOW</a>
        <a href="filmarchive.html">ALL SHOWS</a>
      </nav>
    </div>
  </header>
  <main>
    <section class="series-hero" aria-labelledby="series-title">
      <div class="series-hero-image" role="img" aria-label="Open ocean and waves"></div>
      <div class="series-hero-inner">
        <a class="franchise-title" href="john-spear-show.html">THE JOHN SPEAR SHOW</a>
        <h1 class="series-title" id="series-title">The Search for Sidequests</h1>
        <span class="hero-year">2026</span>
      </div>
      <a class="scroll-indicator" href="#series-content" aria-label="Scroll down to series information and episodes">↓</a>
    </section>
    <div class="series-content" id="series-content">
      <section class="episode-archive" aria-labelledby="archive-heading">
        <h2 class="archive-heading" id="archive-heading">EPISODE ARCHIVE</h2>
        <ol class="episode-list">
          <li><a class="episode-row" href="episode-01.html"><span class="episode-number">01</span><span class="episode-title">Episode title to come</span><span class="episode-year">2026</span><span class="episode-arrow" aria-hidden="true">↗</span></a></li>
          <li><a class="episode-row" href="episode-02.html"><span class="episode-number">02</span><span class="episode-title">Episode title to come</span><span class="episode-year">2026</span><span class="episode-arrow" aria-hidden="true">↗</span></a></li>
          <li><a class="episode-row" href="episode-03.html"><span class="episode-number">03</span><span class="episode-title">Episode title to come</span><span class="episode-year">2026</span><span class="episode-arrow" aria-hidden="true">↗</span></a></li>
        </ol>
      </section>
    </div>
  </main>
  <footer>JazzClub Films © 2026</footer>
  <script>
    (() => {
      const menu = document.querySelector('.site-menu');
      const button = document.querySelector('.site-menu-button');
      const scrollIndicator = document.querySelector('.scroll-indicator');
      const updateScrollIndicator = () => scrollIndicator.classList.toggle('is-hidden', window.scrollY > 0);
      updateScrollIndicator();
      window.addEventListener('scroll', updateScrollIndicator, { passive: true });
      const setMenuOpen = (isOpen) => {
        menu.classList.toggle('is-open', isOpen);
        button.setAttribute('aria-expanded', String(isOpen));
        button.setAttribute('aria-label', isOpen ? 'Close other productions' : 'Open other productions');
      };
      button.addEventListener('click', () => setMenuOpen(button.getAttribute('aria-expanded') !== 'true'));
      document.addEventListener('click', (event) => { if (!menu.contains(event.target)) setMenuOpen(false); });
      document.addEventListener('keydown', (event) => { if (event.key === 'Escape') { setMenuOpen(false); button.focus(); } });
    })();
</script>
</body>
</html>
