<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>About / Contact — JazzClub Films</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
  min-height: 100vh;
  background: #fff;
  color: #111;
  font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande',
               'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
  padding: 32px 40px;

  display: flex;
  flex-direction: column;
}

    /* HEADER */

    header {
      position: relative;
      height: 70px;
    }

    .logo {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      text-decoration: none;
      color: #fff;
      line-height: 0.85;
      text-align: center;
    }

    .logo-main {
      display: block;
      font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande',
                   'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 0;
    }

    .logo-films {
      display: block;
      margin-top: 8px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 0.8rem;
      font-style: italic;
      letter-spacing: 0.35em;
    }

    /* MENU */

    .menu {
      position: absolute;
      top: 0;
      right: 0;
    }

    .menu-button {
      width: 32px;
      height: 32px;
      padding: 7px 4px;
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .menu-button span {
      display: block;
      width: 24px;
      height: 1px;
      background: #fff;
      transition: all 0.3s ease;
    }

    .menu-button:hover span {
      background: #dbe8ff;
      box-shadow: 0 0 8px #183a75;
    }

    .menu-links {
      display: none;
      position: absolute;
      right: 0;
      top: 42px;
      width: max-content;
      text-align: right;
    }

    .menu-links a {
      display: block;
      margin-bottom: 14px;
      color: #fff;
      text-decoration: none;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      transition: color 0.3s ease, text-shadow 0.3s ease;
    }

    .menu-links a:hover {
      color: #dbe8ff;
      text-shadow: 0 0 12px #183a75;
    }

    .menu.open .menu-links {
      display: block;
    }

    /* ABOUT / CONTACT */

    .about {
  width: min(700px, 90vw);
  margin: 12vh auto 0;
  padding-bottom: 15vh;
  flex: 1;
}

    .about-title {
      font-size: 1rem;
      letter-spacing: 0.12em;
      margin-bottom: 32px;
    }

    .about-section {
      margin-bottom: 50px;
    }

    .about-section h2 {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      margin-bottom: 16px;
    }

    .about-section p {
      color: #444;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1rem;
      line-height: 1.7;
    }

    .contact-link {
      color: #444;
      text-decoration: none;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1rem;
      transition: color 0.3s ease, text-shadow 0.3s ease;
    }

    .contact-link:hover {
      color: #536b59;
      text-shadow: none;
    }

    /* FOOTER */

    footer {
      width: min(1100px, 90vw);
      margin: 0 auto;
      padding-bottom: 32px;
      text-align: center;
      color: #444;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
    }

    /* MOBILE */

    @media (max-width: 600px) {

      body {
        padding: 20px;
      }

      header {
        height: 60px;
      }

      .logo-main {
        font-size: 1.5rem;
      }

      .logo-films {
        font-size: 0.7rem;
        margin-top: 7px;
      }

      .about {
        margin-top: 15vh;
      }

      .about-section {
        margin-bottom: 40px;
      }
    }

.site-header {

.site-menu {

.site-menu-button,

}

.site-menu-links a {

  margin-bottom: 14px;

.site-menu-links a:hover {

.site-menu.is-open .site-menu-links {

  }

    /* Shared auto-hide header: clear at the top, white-backed on upward scroll. */
    .site-header { position: fixed; top: 0; right: 0; left: 0; z-index: 50; width: auto; height: 102px; margin: 0; padding: 0; background: transparent; transition: transform .3s ease, background-color .25s ease, box-shadow .25s ease; }
    .site-header.is-hidden { transform: translateY(-100%); }
    .site-header.is-visible-on-scroll { background: transparent; box-shadow: none; }
    .site-header.is-visible-on-scroll::after { position: absolute; right: 40px; bottom: 0; left: 40px; height: 1px; background: linear-gradient(90deg, transparent, rgba(231, 239, 232, .2) 12%, rgba(231, 239, 232, .3) 50%, rgba(231, 239, 232, .2) 88%, transparent); content: ''; filter: blur(1px); pointer-events: none; }
    .site-header .site-brand { top: 32px; left: 40px; }
    .site-header .site-menu { top: 32px; right: 40px; }
    .site-header .site-brand,
    .site-header .site-menu-button,
    .site-header .site-about,
    .site-header .site-menu-links a { color: #111; text-shadow: none; }
    .site-header.is-on-image .site-brand,
    .site-header.is-on-image .site-menu-button,
    .site-header.is-on-image .site-about,
    .site-header.is-on-image .site-menu-links a { color: #fff; text-shadow: 0 1px 8px rgba(0, 0, 0, .35); }
    .site-header.is-visible-on-scroll::after { background: linear-gradient(90deg, transparent, rgba(20, 24, 25, .12) 12%, rgba(20, 24, 25, .18) 50%, rgba(20, 24, 25, .12) 88%, transparent); }
    .site-header.is-visible-on-scroll.is-on-image::after { background: linear-gradient(90deg, transparent, rgba(231, 239, 232, .2) 12%, rgba(231, 239, 232, .3) 50%, rgba(231, 239, 232, .2) 88%, transparent); }
    .site-header.is-visible-on-scroll .site-menu-links { padding: 10px 0 2px; background: transparent; }
    .site-header.is-visible-on-scroll .site-menu-links a:hover,
    .site-header.is-visible-on-scroll .site-menu-button:hover,
    .site-header.is-visible-on-scroll .site-about:hover { color: var(--accent, #c3d3dc); text-shadow: none; }
    .site-header.is-visible-on-scroll .site-menu-button:focus-visible,
    .site-header.is-visible-on-scroll .site-about:focus-visible,
    .site-header.is-visible-on-scroll .site-menu-links a:focus-visible { outline-color: var(--accent, #c3d3dc); }
    @media (max-width: 600px) {
      .site-header { height: 80px; }
      .site-header.is-visible-on-scroll::after { right: 20px; left: 20px; }
      .site-header .site-brand { top: 20px; left: 20px; }
      .site-header .site-menu { top: 20px; right: 20px; }
    }

    .about { width: min(1100px, calc(100% - 80px)); margin: 0 auto; padding: max(230px, 28vh) 0 130px; flex: 1; }
    .about-section { margin: 0 0 46px; }
    .about-section h2 { margin: 0 0 14px; color: #69777d; font-size: .68rem; font-weight: 700; letter-spacing: .18em; }
    .about-section p { color: #111; font-family: Georgia, 'Times New Roman', serif; font-size: clamp(1.4rem, 3.2vw, 2.15rem); line-height: 1.35; }
    .contact-link { color: #111; }
    @media (max-width: 600px) { .about { width: calc(100% - 40px); margin: 0 auto; padding-top: 190px; } .about-section { margin-bottom: 36px; } }

    .footer-heron { display: block; flex: 0 0 auto; width: 34px; height: 24px; margin: 0; color: #252a26; }
    footer { position: relative; display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; padding-top: 28px; color: #444; background: #fff; }
    footer::before { position: absolute; top: 0; left: 50%; width: 100vw; height: 1px; background: linear-gradient(90deg, transparent 0%, rgba(0, 0, 0, .025) 8%, rgba(0, 0, 0, .05) 50%, rgba(0, 0, 0, .025) 92%, transparent 100%); box-shadow: 0 0 10px rgba(0, 0, 0, .025); content: ''; filter: blur(.65px); transform: translateX(-50%); pointer-events: none; }
    body.has-active-show footer::before { background: linear-gradient(90deg, transparent 0%, rgba(232, 242, 234, .1) 8%, rgba(232, 242, 234, .24) 50%, rgba(232, 242, 234, .1) 92%, transparent 100%); box-shadow: 0 0 12px rgba(232, 242, 234, .16); }

  <script>
(() => {
  const header = document.querySelector('.site-header');
  if (!header) return;

  const currentPage = window.location.pathname.split('/').pop() || 'index.html';
  header.querySelectorAll('[data-page]').forEach((link) => {
    if (link.dataset.page === currentPage) link.remove();
  });

  const menu = header.querySelector('.site-menu');
  const button = header.querySelector('.site-menu-button');
  const setMenuOpen = (isOpen) => {
    menu.classList.toggle('is-open', isOpen);
    button.setAttribute('aria-expanded', String(isOpen));
    button.setAttribute('aria-label', isOpen ? 'Close other productions' : 'Open other productions');
  };

  button.addEventListener('click', () => {
    setMenuOpen(button.getAttribute('aria-expanded') !== 'true');
  });
  document.addEventListener('click', (event) => {
    if (!menu.contains(event.target)) setMenuOpen(false);
  });
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') {
      setMenuOpen(false);
      button.focus();
    }
  });
})();

  </script>

  <script>
    (() => {
      const header = document.querySelector('.site-header');
      if (!header) return;
      const hero = document.querySelector('.hero, .series-hero');
      const updateContrast = () => header.classList.toggle('is-on-image', Boolean(hero && window.scrollY < hero.offsetHeight * .92));
      let previousY = window.scrollY;
      updateContrast();
      if (previousY > 0) header.classList.add('is-visible-on-scroll');
      window.addEventListener('scroll', () => {
        const currentY = window.scrollY;
        updateContrast();
        if (currentY <= 0) {
          header.classList.remove('is-hidden', 'is-visible-on-scroll');
        } else if (currentY < previousY) {
          header.classList.remove('is-hidden');
          header.classList.add('is-visible-on-scroll');
        } else if (currentY > header.offsetHeight) {
          header.classList.add('is-hidden');
          header.classList.remove('is-visible-on-scroll');
        }
        previousY = currentY;
      }, { passive: true });
    })();
  </script>
