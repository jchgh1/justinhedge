<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="favicon.ico?v=20260926" type="image/x-icon">
  <title>About / Contact — JazzClub Films</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
  min-height: 100vh;
  background: #08090b;
  color: #fff;
  font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande',
               'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
  padding: 32px 40px;

  display: flex;
  flex-direction: column;
}

    /* HEADER */

    header {
      position: relative;
      height: 70px;
    }

    .logo {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      text-decoration: none;
      color: #fff;
      line-height: 0.85;
      text-align: center;
    }

    .logo-main {
      display: block;
      font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande',
                   'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 0;
    }

    .logo-films {
      display: block;
      margin-top: 8px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 0.8rem;
      font-style: italic;
      letter-spacing: 0.35em;
    }

    /* MENU */

    .menu {
      position: absolute;
      top: 0;
      right: 0;
    }

    .menu-button {
      width: 32px;
      height: 32px;
      padding: 7px 4px;
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .menu-button span {
      display: block;
      width: 24px;
      height: 1px;
      background: #fff;
      transition: all 0.3s ease;
    }

    .menu-button:hover span {
      background: #dbe8ff;
      box-shadow: 0 0 8px #183a75;
    }

    .menu-links {
      display: none;
      position: absolute;
      right: 0;
      top: 42px;
      width: max-content;
      text-align: right;
    }

    .menu-links a {
      display: block;
      margin-bottom: 14px;
      color: #fff;
      text-decoration: none;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      transition: color 0.3s ease, text-shadow 0.3s ease;
    }

    .menu-links a:hover {
      color: #dbe8ff;
      text-shadow: 0 0 12px #183a75;
    }

    .menu.open .menu-links {
      display: block;
    }

    /* ABOUT / CONTACT */

    .about {
  width: min(700px, 90vw);
  margin: 12vh auto 0;
  padding-bottom: 15vh;
  flex: 1;
}

    .about-title {
      font-size: 1rem;
      letter-spacing: 0.12em;
      margin-bottom: 32px;
    }

    .about-section {
      margin-bottom: 50px;
    }

    .about-section h2 {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      margin-bottom: 16px;
    }

    .about-section p {
      color: #aaa;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1rem;
      line-height: 1.7;
    }

    .contact-link {
      color: #aaa;
      text-decoration: none;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1rem;
      transition: color 0.3s ease, text-shadow 0.3s ease;
    }

    .contact-link:hover {
      color: #dbe8ff;
      text-shadow: 0 0 12px #183a75;
    }

    /* FOOTER */

    footer {
      width: min(1100px, 90vw);
      margin: 0 auto;
      padding-bottom: 32px;
      text-align: center;
      color: #444;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
    }

    /* MOBILE */

    @media (max-width: 600px) {

      body {
        padding: 20px;
      }

      header {
        height: 60px;
      }

      .logo-main {
        font-size: 1.5rem;
      }

      .logo-films {
        font-size: 0.7rem;
        margin-top: 7px;
      }

      .about {
        margin-top: 15vh;
      }

      .about-section {
        margin-bottom: 40px;
      }
    }

.site-header {
  position: relative;
  height: 70px;
  width: 100%;
  margin: 0;
  z-index: 20;
}

.site-brand {
  position: absolute;
  top: 0;
  left: 0;
  width: max-content;
  color: #fff;
  text-align: left;
  text-decoration: none;
  line-height: 0.85;
}

.site-brand-text {
  display: block;
  font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande',
    'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
  font-size: 2rem;
  font-weight: 900;
}

.site-brand-films {
  display: block;
  margin-top: 8px;
  font-family: Georgia, 'Times New Roman', serif;
  font-size: 0.8rem;
  font-style: italic;
  letter-spacing: 0.35em;
  text-align: center;
  width: 100%;
}

.site-menu {
  position: absolute;
  top: 0;
  right: 0;
  display: flex;
  align-items: center;
  gap: 26px;
}

.site-menu-button,
.site-about {
  padding: 0;
  border: 0;
  background: transparent;
  color: #fff;
  font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande',
    'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-decoration: none;
  white-space: nowrap;
  cursor: pointer;
  transition: color 0.3s ease, text-shadow 0.3s ease;
}

.site-menu-button:hover,
.site-menu-button:focus-visible,
.site-about:hover {
  color: #c3d3dc;
  text-shadow: 0 0 12px #31516a;
}

.site-menu-button:focus-visible,
.site-brand:focus-visible,
.site-menu-links a:focus-visible,
.site-about:focus-visible {
  outline: 1px solid #c3d3dc;
  outline-offset: 5px;
}

.site-menu-links {
  display: none;
  position: absolute;
  top: 36px;
  right: 0;
  width: max-content;
  text-align: right;
}

.site-menu-links a {
  display: block;
  margin-bottom: 14px;
  color: #fff;
  font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande',
    'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-decoration: none;
  transition: color 0.3s ease, text-shadow 0.3s ease;
}

.site-menu-links a:hover {
  color: #c3d3dc;
  text-shadow: 0 0 12px #31516a;
}

.site-menu.is-open .site-menu-links {
  display: block;
}

.home-page {
  display: flex;
  min-height: 100vh;
  padding: 32px 40px;
  flex-direction: column;
  align-items: stretch;
  justify-content: flex-start;
}

.home-page .title {
  margin: auto;
}

.john-spear-page .site-header {
  width: auto;
  margin: 32px 40px 0;
}

@media (max-width: 600px) {
  .site-header {
    height: 60px;
  }

  .site-brand-text {
    font-size: 1.5rem;
  }

  .site-brand-films {
    margin-top: 7px;
    font-size: 0.7rem;
  }

  .site-menu {
    gap: 12px;
  }

  .site-menu-button,
  .site-about {
    font-size: 0.5rem;
    letter-spacing: 0.06em;
  }

  .site-menu-links {
    top: 30px;
    right: 0;
  }

  .home-page {
    padding: 24px;
  }

  .john-spear-page .site-header {
    margin: 20px 20px 0;
  }
}

  </style>
</head>

<body>

  <header class="site-header">
    <a class="site-brand" href="index.html" aria-label="JazzClub Films home"><span class="site-brand-text">JAZZCLUB</span><span class="site-brand-films">films</span></a>
    <div class="site-menu">
      <button class="site-menu-button" type="button" aria-label="Open other productions" aria-expanded="false" aria-controls="site-menu-links">OTHER PRODUCTIONS</button>
      <nav class="site-menu-links" id="site-menu-links" aria-label="Other productions">
        <a href="john-spear-show.html">THE JOHN SPEAR SHOW</a>
        <a href="search-for-sidequests.html">THE SEARCH FOR SIDEQUESTS</a>
        <a href="filmarchive.html">ALL SHOWS</a>
      </nav>
    </div>
  </header>


  <main class="about">


    <section class="about-section">

      <h2>ABOUT</h2>

      <p>
        Independent documentary films.
      </p>

    </section>


    <section class="about-section">

      <h2>CONTACT</h2>

      <p>
        jch@jazzclubfilms.com
      </p>

    </section>


  </main>


  <footer>
    JazzClub Films © 2026
  </footer>



  <script>
(() => {
  const header = document.querySelector('.site-header');
  if (!header) return;

  const currentPage = window.location.pathname.split('/').pop() || 'index.html';
  header.querySelectorAll('[data-page]').forEach((link) => {
    if (link.dataset.page === currentPage) link.remove();
  });

  const menu = header.querySelector('.site-menu');
  const button = header.querySelector('.site-menu-button');
  const setMenuOpen = (isOpen) => {
    menu.classList.toggle('is-open', isOpen);
    button.setAttribute('aria-expanded', String(isOpen));
    button.setAttribute('aria-label', isOpen ? 'Close other productions' : 'Open other productions');
  };

  button.addEventListener('click', () => {
    setMenuOpen(button.getAttribute('aria-expanded') !== 'true');
  });
  document.addEventListener('click', (event) => {
    if (!menu.contains(event.target)) setMenuOpen(false);
  });
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') {
      setMenuOpen(false);
      button.focus();
    }
  });
})();

  </script>
</body>
</html>
