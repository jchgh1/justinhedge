    .title { position: relative; z-index: 1; text-align: center; }
    h1 { font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif; font-size: clamp(3rem, 8vw, 8rem); font-weight: 900; line-height: .9; }

    @keyframes pearlPulse {
      0%, 50%, 100% { color: #fff; -webkit-text-stroke: 0; text-shadow: none; }
      70%, 80% { color: #e4ede5; -webkit-text-stroke: 1px #b4c9b8; text-shadow: 0 0 5px rgba(239, 247, 239, .85), 0 0 12px rgba(207, 226, 210, .7), 0 0 24px rgba(170, 198, 176, .48), 0 0 40px rgba(139, 171, 146, .28); }

    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
